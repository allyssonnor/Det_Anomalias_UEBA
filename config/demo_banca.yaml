metadata:
  name: Demo de banca - modelos generalistas e especialista em brute force
  role: Reexecução demonstrativa dos protocolos YAML 02 e YAML 05 com uma semente
settings:
  results_root: results/demo_banca_v2
  cache_root: data/GLOBAL_CACHE_DETECTOR_demo_banca_v2
  # Uma semente para a demo; resultados ilustrativos, não substituem a campanha confirmatória.
  seeds: [42]
  save_checkpoints: true
  run_mixed_eval: true
  run_isolated_eval: false
datasets:
  # Modelos generalistas: protocolo YAML 02, no dataset reduzido versionado no Git.
  - name: Synthetic_Chronological_Demo
    overrides:
      sampling.split_strategy: chronological
      data.dataset_path: seed_1_cut.txt
      features.enabled_groups: &feature_groups
        - auth_failure
        - volume_anomaly
        - temporal_anomaly
        - lateral_movement
        - rdp_anomaly
        - golden_ticket
        - process_anomaly
        - privilege_anomaly
  - name: Synthetic_Random_Demo
    overrides:
      sampling.split_strategy: random
      data.dataset_path: seed_1_cut.txt
      features.enabled_groups: *feature_groups

  # Especialista em brute force: protocolo YAML 05.
  # Coloque o dataset usado na tese em data/test_bruteforce_42.jsonl.
  - name: Synthetic_Chronological_Bruteforce
    overrides:
      sampling.split_strategy: chronological
      data.dataset_path: data/test_bruteforce_42.jsonl
      features.enabled_groups: *feature_groups
  - name: Synthetic_Random_Bruteforce
    overrides:
      sampling.split_strategy: random
      data.dataset_path: data/test_bruteforce_42.jsonl
      features.enabled_groups: *feature_groups

model_presets:
  - name: RandomForest
    overrides:
      model.type: random_forest_supervised
      training.supervised: true
      model.random_forest_supervised:
        n_estimators: 150
        max_depth: 8
        class_weight: balanced_subsample
        n_jobs: 1
  - name: MLP_Single
    overrides:
      model.type: mlp_single
      training.supervised: false
      model.mlp_single:
        hidden_layer_sizes: [64, 32]
        max_iter: 100
        early_stopping: true
        validation_fraction: 0.1
hyperparameter_grid:
  training.threshold_mode: [global, per_user]
  model.sequence_length: [20]
data:
  dataset_path: seed_1_cut.txt
  target_col: Is_Anomaly
  time_nan_strategy: nan
sampling:
  mode: full
  split_ratios:
    train: 0.7
    val: 0.2
    test: 0.1
training:
  resume: false
  save_model: true
temporal:
  session_timeout: 1800
  min_events_session: 2
