# ==============================================================================
# PLANO ESTRUTURADO DE EXPERIMENTOS CONSOLIDADO - MARATONA DE TESE (CPU COLAB)
# ==============================================================================
# Este arquivo configura a execução otimizada de deep learning na CPU.
# Garante consistência metodológica mantendo épocas e capacidades de camadas
# totalmente comparáveis entre todos os modelos avaliados.
# ==============================================================================

# APONTA PARA SI MESMO (EVITA ERRO DE base_config FALTANTE NO GOOGLE COLAB)
base_config: "config/detectar_CPU.yaml"

# ==============================================================================
# 1. MATRIZ DE DATASETS 
# ==============================================================================
datasets:
  - name: "Synthetic"
    overrides: {}   # Usa os caminhos definidos na base_config (seção 5 - data)

#  - name: "CERT"
#    overrides:
#      data.train_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/CERT/train"
#      data.val_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/CERT/val"
#      data.test_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/CERT/test"
#      data.target_col: "Is_Anomaly"
#      data.label_filename: "labels.csv"

#  - name: "LANL"
#    overrides:
#      data.train_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/lanl/train"
#      data.val_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/lanl/val"
#      data.test_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/lanl/test"
#      data.target_col: "Is_Anomaly"
#      data.label_filename: "gabarito.csv"

# ==============================================================================
# 2. CONFIGURAÇÕES DE MODELOS (PRESETS PARA O RUNNER)
# ==============================================================================
model_presets:
  # ------------------------------------------------------------
  # MLP Single_CPU
  # ------------------------------------------------------------
  - name: "MLP_Single_CPU"
    overrides:
      model.type: "mlp_single"
      training.batch_size: 64            
      model.mlp_single:
        hidden_layer_sizes: [32]      
        max_iter: 50                      
  # ------------------------------------------------------------
  # Isolation Forest CPU
  # ------------------------------------------------------------
#  - name: "Isolation_Forest_CPU"
#    overrides:
#      model.type: "isolation_forest"
#      model.isolation_forest:
#        n_estimators: 200
#        contamination: "auto"
  # ------------------------------------------------------------
  # LOF CPU
  # ------------------------------------------------------------
#  - name: "LOF CPU"
#    overrides:
#      model.type: "lof"
#      model.lof:
#        n_neighbors: 20
#        contamination: 0.1
  # ------------------------------------------------------------
  # OCSVM CPU
  # ------------------------------------------------------------
#  - name: "OCSVM CPU"
#    overrides:
#      model.type: "ocsvm"
#      model.ocsvm:
#        nu: 0.05
# ==============================================================================
# 3. GRID DE HIPERPARÂMETROS (Parâmetros da varredura sistemática)
# ==============================================================================
hyperparameter_grid:
  # Modo de threshold: global (um limiar para todos) OU per_user (limiar por usuário)
  training.threshold_mode: ["global", "per_user"]

  # Tamanho da janela temporal (quantos eventos passados o modelo enxerga)
  # Fixado em 20 para os melhores modelos de deep learning
  model.sequence_length: [10]

  # Número de épocas máximo parametrizado uniformemente para a maratona
  training.epochs: [50]

# ==============================================================================
# 4. CONFIGURAÇÕES DO EXECUTOR / SETTINGS
# ==============================================================================
settings:
  # Diretório onde os resultados do Google Colab serão salvos
  results_root: "/content/drive/MyDrive/Project_Detector/results/colab_cpu_runs"

  # Sementes completas para reprodutibilidade e cálculo de intervalo de confiança
  seeds: [42]

#  generate_plots: true
  save_checkpoints: true

# ==============================================================================
# 5. CONFIGURAÇÃO BASE (DATA, MODELO, TREINO, FEATURES, ETC.)
# ==============================================================================

# --- CAMADA DE DADOS (Colab Paths) ---
data:
  train_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/synthetic/train"
  val_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/synthetic/val"
  test_path: "/content/drive/MyDrive/Project_Detector/data/output_thesis_marathon/synthetic/test"

  # Coluna de ground truth (gabarito)
  target_col: "Is_Anomaly"

  # Estratégia para tratar valores de tempo (Time) nulos ou inválidos.
  # "nan"  -> Mantém como NaN (estatisticamente seguro, evita viés de 1970).
  # "zero" -> Converte para 0.0 (equivale a 01/01/1970).
  # "min"  -> Converte para o menor timestamp do log.
  time_nan_strategy: "nan"

# --- CAMADA DO MODELO ---
model:
  # Tipo de modelo padrão (será sobrescrito pelos presets ativos)
  type: "mlp_single"

  # Tamanho da janela temporal padrão
  sequence_length: 20

# --- CAMADA DE TREINAMENTO ---
training:
  batch_size: 256
  epochs: 50
  learning_rate: 0.001
  validation_split: 0.1
  early_stopping_patience: 10
  seed: 42
  resume: false
  save_model: true

# --- CAMADA DE AMOSTRAGEM (DEBUG vs FULL) ---
sampling:
  mode: "debug"        # "full" para rodar com o conjunto de dados completo na GPU T4
  train_size: 5000
  val_size: 1000
  test_size: 1000

# --- LÓGICA TEMPORAL ---
temporal:
  session_timeout: 1800    # 30 minutos
  min_events_session: 2

# --- CONFIGURAÇÃO DE FEATURES ---
features:
  enabled: true
  enabled_groups:
    - "temporal_anomaly"
    - "volume_anomaly"
    - "lateral_movement"
    - "auth_failure"
    - "rdp_anomaly"
    - "golden_ticket"
    - "process_anomaly"
    - "privilege_anomaly"

# --- DIRETÓRIO DE SAÍDA (FALLBACK LOCAL) ---
output_dir: "results/colab_cpu_runs"
