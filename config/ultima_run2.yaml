# ==============================================================================
# PLANO ESTRUTURADO DE DETECÇÃO ISOLADA
# ==============================================================================

# ==============================================================================
# 1. MATRIZ DE DATASETS
# ==============================================================================
datasets:
  - name: "Synthetic"
    overrides:
      data.train_path: "/content/drive/MyDrive/Project_Detector/data/synthetic/train/train.jsonl"
      data.val_path: "/content/drive/MyDrive/Project_Detector/data/synthetic/val/val.jsonl"
      data.test_path: "/content/drive/MyDrive/Project_Detector/data/synthetic/test/test.jsonl"
      data.isolated_tests_dir: "/content/drive/MyDrive/Project_Detector/data/synthetic2"
      data.target_col: "Is_Anomaly"
      data.label_filename: "labels.csv"
# ==============================================================================
# 2. CONFIGURAÇÕES DO MODELO 
# ==============================================================================

model_presets:
#  - name: "MLP_Single CPU"
#    overrides:
#      model.type: "mlp_single"
#      training.batch_size: 64
#      model.mlp_single:
#        hidden_layer_sizes: [32]
#        max_iter: 50

# ==============================================================================
# 3. GRID DE HIPERPARÂMETROS (A PROVA DA TESE)
# ==============================================================================
hyperparameter_grid:
  # Vai rodar o dataset e modelo duas vezes: 
  # uma com estatística global e outra com UEBA per_user
  training.threshold_mode: ["global", "per_user"]
  model.sequence_length: [20]
  training.epochs: [20]
# ==============================================================================
# 4. CONFIGURAÇÕES DO EXECUTOR / SETTINGS DO RUNNER
# ==============================================================================
settings:
  results_root: "results/colab_cpu_runs/ISOLATED"
  generate_plots: true
  save_checkpoints: true
  seeds: [42]

# ==============================================================================
# 5. CONFIGURAÇÃO BASE 
# ==============================================================================
# --- CAMADA DE DADOS (DATA LAYER) ---
data:
  train_path: "data/synthetic/train/train.jsonl"
  val_path: "data/synthetic/val/val.jsonl"
  test_path: "data/synthetic/test/test.jsonl"
  
  # Novo Caminho adicionado aqui para detecção direta no script de isolados
  isolated_tests_dir: "/content/drive/MyDrive/Project_Detector/data/synthetic2"

  # A coluna que possui o gabarito (Ground Truth) a ser isolada pelo Trainer.
  target_col: "Is_Anomaly"

  # Estratégia para tratar valores de tempo (Time) nulos ou inválidos.
  # "nan"  -> Mantém como NaN (estatisticamente seguro, evita viés de 1970).
  # "zero" -> Converte para 0.0 (equivale a 01/01/1970).
  # "min"  -> Converte para o menor timestamp do log.
  time_nan_strategy: "nan"

# --- CAMADA DO MODELO (MODEL LAYER) ---
model:
  # O tipo de detector usado por padrão.
  type: "mlp_single"

  # Quantidade de eventos passados observados numa janela temporal (Memória de curto prazo).
  sequence_length: 20
  
# --- CAMADA DE TREINAMENTO E RESILIÊNCIA (TRAINING LAYER) ---
training:
  batch_size: 256
  epochs: 50
  learning_rate: 0.001
  validation_split: 0.1

  # Parada antecipada para evitar desperdício de épocas/recursos computacionais
  early_stopping_patience: 10
  seed: 42

  # Retoma a execução a partir do último checkpoint (saved_model + scalers)
  resume: false

  # Define se os pesos estruturais dos modelos devem ser persistidos
  save_model: true
  
# [NOVO] Fixação Manual de Limiares (Opcional)
# Descomentar (remover o '#') de UMA das opções abaixo se não quiser usar a busca automática pelo melhor F2-Score:
#  fixed_percentile: 98.5    # Corta fixo nos N% mais anômalos (respeita o modo per_user ou global).
# fixed_threshold: 0.90      # Corte absoluto: valor exato da anomalia (ignora percentis e o modo per_user).

  # Estratégia de Calibragem do Detector
  # "per_user": UEBA Clássico. Cada utilizador tem o seu próprio limiar dinâmico.
  # "global":   Estatística Tradicional. Um único limiar para todo o parque.
  threshold_mode: ["global", "per_user"]

# --- CAMADA DE AMOSTRAGEM (SAMPLING LAYER) ---
# "full": Ignora os limites abaixo e lê 100% dos dados (Execução Real).
# "debug": Lê apenas as fatias definidas (Sanity check instantâneo).
sampling:
  mode: "full"
  train_size: 5000
  val_size: 1000
  test_size: 1000

# --- LÓGICA TEMPORAL (TEMPORAL BUILDER) ---
temporal:
  # Tempo de inatividade (segundos) para expiração de sessão. 1800s = 30 minutos (Padrão UEBA).
  session_timeout: 1800
  # Remove do treino/avaliação sessões com apenas 1 evento (ruído).
  min_events_session: 2

# --- CONFIGURAÇÃO DE FEATURES (FEATURE PROCESSOR) ---
features:
  # Habilita ou desabilita o Cientista de Features
  enabled: true

  # Lista explícita de grupos de ameaças a serem transformados em tensores matemáticos.
  enabled_groups:
    - "temporal_anomaly"
    - "volume_anomaly"
    - "lateral_movement"
    - "auth_failure"
    - "rdp_anomaly"
    - "golden_ticket"
    - "process_anomaly"
    - "privilege_anomaly"

# --- DIRETÓRIO DE SAÍDA ---
output_dir: "results/LAST_RUN_FINAL/full/isolated/MLP_SINGLE"
